<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      color: #1e293b;
      background-color: #ffffff;
    }
    h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 16px;
      color: #3b82f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .region-badge {
      font-size: 0.7rem;
      background: #eff6ff;
      color: #3b82f6;
      padding: 2px 8px;
      border-radius: 99px;
      cursor: pointer;
      border: 1px solid #dbeafe;
    }
    .region-badge:hover {
      background: #dbeafe;
    }
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-weight: 600;
      font-size: 0.9rem;
    }
    /* Region Selection Screen */
    #setup-screen {
      display: none;
      text-align: center;
    }
    #main-screen {
      display: block;
    }
    .region-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .region-btn {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .region-btn:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .region-btn.active {
      border-color: #3b82f6;
      background: #3b82f6;
      color: white;
    }

    /* Simple CSS Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1; transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }
    
    .btn-primary {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Region Selection Setup -->
  <div id="setup-screen">
    <h3 style="margin-top:0;">Select Your Region</h3>
    <p style="font-size:0.85rem; color:#64748b;">Choose a market to analyze. You can change this later.</p>
    <div class="region-options">
      <div class="region-btn" data-region="USA">USA</div>
      <div class="region-btn" data-region="India">India</div>
    </div>
    <button id="save-region" class="btn-primary" disabled>Continue</button>
  </div>

  <!-- Main Dashboard Control -->
  <div id="main-screen">
    <h2>
      Market AI
      <span id="current-region-btn" class="region-badge">USA (Edit)</span>
    </h2>
    
    <div class="toggle-container">
      <span class="toggle-label">Side Panel</span>
      <label class="switch">
        <input type="checkbox" id="sidebar-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <button id="refresh-news-btn" class="btn-primary" style="background:#f1f5f9; color:#475569; margin-top:0;">
      Refresh Feeds
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
